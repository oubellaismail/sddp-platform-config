apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Install the operator (and its CRDs) before the SecretStore/ExternalSecret
    # custom resources in external-secrets-config (wave 2) that depend on them.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      values: |
        # installCRDs is true by default; kept explicit — the ExternalSecret /
        # ClusterSecretStore CRDs must exist before external-secrets-config syncs.
        installCRDs: true
        # Resource limits on all three components so the operator pods are a
        # properly-sized platform tier (cpu + memory request + memory limit, no
        # cpu limit) rather than being exempted from the resource-limits policy.
        # The default securityContext is already non-root / drop-ALL / seccomp
        # RuntimeDefault, so the pods satisfy the restricted profile as-is.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
