apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: placeholder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:oubellaismail/sddp-platform-config.git
    targetRevision: main
    path: manifests/placeholder
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
