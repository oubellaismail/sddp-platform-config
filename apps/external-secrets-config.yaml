apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    # Syncs after the operator (wave 1) so the ExternalSecret / ClusterSecretStore
    # CRDs it relies on already exist. If it still races on a cold start, selfHeal
    # reconciles it once the operator is up.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    # Raw manifests in THIS repo: the ClusterSecretStore that points at the
    # Infisical Cloud project, and the ExternalSecrets that materialize the
    # platform's standing secrets from it.
    repoURL: git@github.com:oubellaismail/sddp-platform-config.git
    targetRevision: main
    path: manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    # ClusterSecretStore is cluster-scoped and the ExternalSecrets set their own
    # namespaces, so this is nominal — kept as external-secrets to group logically.
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
