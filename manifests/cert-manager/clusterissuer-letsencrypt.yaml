# Let's Encrypt production ClusterIssuer, DNS-01 challenge via DigitalOcean DNS
# (cert-manager's built-in `digitalocean` solver — no third-party webhook).
#
# DNS-01 (not HTTP-01) deliberately: HTTP-01 spins up an ACME solver pod in the
# certificate's own namespace, which for an application namespace (sddp-app)
# would be rejected by the signed-DOCR-only admission policies. DNS-01 proves
# domain control with a TXT record instead, so no solver pod runs anywhere and
# the app namespaces keep their guarantees intact.
#
# The DO API token comes from the `digitalocean-dns-token` secret (ESO-synced
# from Infisical `do_dns_token`; a DO token with write access to Domains).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: oubellaismail00@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns-token
              key: access-token
