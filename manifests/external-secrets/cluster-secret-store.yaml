# ClusterSecretStore — the cluster's single connection to the Infisical Cloud
# project that holds the platform's real secret values. Cluster-scoped so a
# single store serves ExternalSecrets in any namespace (docr-read in kyverno,
# db-credentials in sddp-app). ESO authenticates with a machine-identity
# Universal Auth credential (clientId/clientSecret) held in the
# infisical-universal-auth secret, which Terraform seeds into this namespace at
# provision time — the one standing bootstrap credential.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: sddp-p-or-3
        environmentSlug: prod
        secretsPath: /
