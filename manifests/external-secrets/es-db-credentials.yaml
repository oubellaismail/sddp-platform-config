# db-credentials — the Postgres tier's user/password/db + the backend's
# DATABASE_URL. Formerly created by hand after every cluster recreate; now
# materialized declaratively by ESO from the `postgres_password` value in
# Infisical. User and db name are non-secret literals; the password comes from
# the store and DATABASE_URL is assembled from it (points at the db Service).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: sddp-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_USER: "sddp"
        POSTGRES_DB: "sddp"
        POSTGRES_PASSWORD: "{{ .pgpass }}"
        DATABASE_URL: "postgres://sddp:{{ .pgpass }}@db:5432/sddp"
  data:
    - secretKey: pgpass
      remoteRef:
        key: postgres_password
